<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>printers.protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>printers.protocol</h1>
        <p>Screenprinting Pre-Flight Analysis</p>
    </header>

    <main class="app-container">
        
        <!-- LEFT: Preview Area -->
        <section class="visual-panel">
            <div id="dropzone" class="dropzone active">
                <p>Drag & Drop PDF here</p>
                <button id="upload-btn" class="btn-secondary">Select File</button>
                <input type="file" id="file-input" accept="application/pdf" hidden>
            </div>
            
            <div id="preview-container" class="preview-container hidden">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <canvas id="pdf-preview"></canvas>
                    <canvas id="error-overlay" class="hidden"></canvas>
                </div>
            </div>
        </section>

        <!-- RIGHT: Control Panel -->
        <section class="control-panel">
            <div class="parameter-group">
                <label for="print-medium">
                    Screen Mesh 
                    <span id="stroke-info" class="stroke-info"></span>
                </label>
                <select id="print-medium">
                    <option value="43T" data-min-stroke="0.4">43T Textile Standard (Min: 0.4mm)</option>
                    <option value="55T" data-min-stroke="0.3">54T/55T Textile Fine (Min: 0.3mm)</option>
                    <option value="77T" data-min-stroke="0.2">77T Paper Standard (Min: 0.2mm)</option>
                    <option value="90T" data-min-stroke="0.15">90T Graphic Fine (Min: 0.15mm)</option>
                    <option value="120T" data-min-stroke="0.1">120T Ultra Fine (Min: 0.1mm)</option>
                    <option value="custom" data-min-stroke="0.4">Custom Thickness...</option>
                </select>
            </div>

            <div class="parameter-group custom-stroke hidden" id="custom-stroke-group">
                <label for="custom-stroke">Custom Min Stroke (mm)</label>
                <input type="number" id="custom-stroke" step="0.05" value="0.4">
            </div>

            <div class="parameter-group dual-input">
                <div class="input-half">
                    <label for="print-width">Actual Width (cm)</label>
                    <input type="number" id="print-width" placeholder="W" step="0.1">
                </div>
                <div class="input-half">
                    <label for="print-height">Actual Height (cm)</label>
                    <input type="number" id="print-height" placeholder="H" step="0.1">
                </div>
            </div>

            <button id="analyze-btn" class="btn-primary" disabled>Analyze Printfile</button>

            <div id="loading-state" class="loading-state hidden">
                <p id="loading-text">Analyzing pixels...</p>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            </div>

            <div id="results-panel" class="results-panel hidden">
                <h2 id="result-status">Check Done!</h2>
                <ul class="result-details">
                    <li>Size Check: <span id="res-size">Pass</span></li>
                    <li>Grayscale Check: <span id="res-gray">Pass</span></li>
                    <li>Stroke Check: <span id="res-stroke" class="fail-text">Failed</span></li>
                </ul>
                
                <div class="zebra-toggle">
                    <label class="switch">
                        <input type="checkbox" id="zebra-meter">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">Highlight Error Areas</span>
                </div>

                <button id="btn-actual-size" class="btn-primary btn-small w-100">Open Actual Size & Measure</button>
            </div>
        </section>
    </main>

    <!-- PRO ACTUAL SIZE WORKSPACE -->
    <div id="actual-size-modal" class="hidden">
        <div class="modal-toolbar">
            <button id="toggle-measure" class="btn-secondary btn-small">Interactive Measure: OFF</button>
            <span class="tool-hint hidden" id="measure-hint"><em>Hold SHIFT to snap angles.</em></span>
            <button id="close-modal" class="btn-primary btn-small">Close Workspace</button>
        </div>
        
        <div class="modal-scroll-area">
            <div id="actual-size-wrapper">
                <div class="modal-corner"></div>
                <canvas id="modal-ruler-top"></canvas>
                <canvas id="modal-ruler-left"></canvas>
                <div id="actual-size-container">
                    <canvas id="actual-size-canvas"></canvas>
                    <canvas id="interaction-layer"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="brand-footer">by splinters.protocol</div>

    <script src="app.js"></script>
</body>
</html>
